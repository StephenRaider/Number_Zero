<div id="car-customizer">
  <div class="viz-controls">
    <label class="form-label">Car<select class="form-select" data-control="car"><option value="silvia">Nissan Silvia S13</option><option value="civic">Honda Civic Type R EK9</option></select></label>
    <label class="form-label">View<select class="form-select" data-control="view"><option value="front">Front</option><option value="back">Rear</option></select></label>
    <label class="form-label">Show<select class="form-select" data-control="layer"><option value="complete">Complete car</option><option value="body">Body only</option><option value="wheels">Wheels only</option></select></label>
  </div>
  <canvas width="176" height="156" role="img" aria-label="Customizable isometric car with separate steering wheels, adjustable body height, paint and lighting"></canvas>
  <div class="viz-controls">
    <label class="form-label">Steering<select class="form-select" data-control="pose"><option value="left">Left</option><option value="straight" selected>Straight</option><option value="right">Right</option></select></label>
    <label class="form-label">Ride height<select class="form-select" data-control="ride"><option value="0">Stock</option><option value="1">Low · 1 px</option><option value="2">Lowest · 2 px</option></select></label>
    <label class="form-label">Body paint<input class="form-control form-control-color" data-control="paint" type="color" value="#ffeaba"></label>
    <label class="form-label" data-secondary>Lower body paint<input class="form-control form-control-color" data-control="secondary" type="color" value="#aeaeae"></label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" data-control="hood" type="checkbox"><span class="form-check-label">Black hood</span></label>
    <label class="form-check"><input class="form-check-input" data-control="carbon" type="checkbox"><span class="form-check-label">Carbon pattern</span></label>
    <label class="form-check" data-two-tone><input class="form-check-input" data-control="twotone" type="checkbox" checked><span class="form-check-label">Two-tone Silvia</span></label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" data-control="headlights" type="checkbox"><span class="form-check-label">Headlights</span></label>
    <label class="form-check"><input class="form-check-input" data-control="taillights" type="checkbox"><span class="form-check-label">Tail lights</span></label>
    <label class="form-check"><input class="form-check-input" data-control="brake" type="checkbox"><span class="form-check-label">Brake lights</span></label>
    <label class="form-check"><input class="form-check-input" data-control="hazards" type="checkbox"><span class="form-check-label">Hazards</span></label>
  </div>
  <div class="viz-controls">
    <label class="form-label">Light angle <output data-value="angle"></output><input class="form-range" data-control="angle" type="range" min="0" max="360" value="220" step="1"></label>
    <label class="form-label">Light height <output data-value="height"></output><input class="form-range" data-control="height" type="range" min="0.4" max="6" value="3" step="0.1"></label>
    <label class="form-label">Intensity <output data-value="power"></output><input class="form-range" data-control="power" type="range" min="0" max="3" value="1.5" step="0.05"></label>
    <label class="form-label">Light colour<input class="form-control form-control-color" data-control="colour" type="color" value="#ffe4bd"></label>
  </div>
  <div class="viz-row">
    <label class="form-check"><input class="form-check-input" data-control="lit" type="checkbox" checked><span class="form-check-label">Dynamic lighting</span></label>
    <label class="form-check"><input class="form-check-input" data-control="shadows" type="checkbox" checked><span class="form-check-label">Depth shadows</span></label>
  </div>
  <span class="sr-only" data-status aria-live="polite"></span>
</div>
<style>
#car-customizer{display:grid;gap:calc(var(--font-size-base,14px)*.75)}
#car-customizer canvas{width:100%;max-width:560px;height:auto;image-rendering:pixelated;justify-self:center}
#car-customizer [hidden]{display:none}
</style>
